<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Victus mark: a bowl whose rim forms a "V", with a single leaf.
    The plate follows the browser's own theme — a near-black tile disappears on a dark
    tab strip, which is exactly where a tab icon has to be recognisable.
  -->
  <style>
    .plate { fill: #16171a; }
    @media (prefers-color-scheme: dark) { .plate { fill: #f2f1ec; } }
  </style>
  <rect class="plate" width="64" height="64" rx="14"/>
  <path d="M10 23 L32 53 L54 23 Z" fill="#2a78d6"/>
  <path d="M10 23 Q32 35 54 23 L54 29 Q32 41 10 29 Z" fill="#8ab4ff" opacity="0.55"/>
  <path d="M36 8 C46 8 50 14 50 20 C42 20 37 16 36 8 Z" fill="#1baf7a"/>
</svg>
