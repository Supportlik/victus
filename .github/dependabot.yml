version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors are dictated by the Angular compiler's supported range;
      # they arrive with the Angular update, not on their own.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vitest majors follow @angular/build's peer range.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Every FROM under deploy/ (api, web, caddy) plus the images in the compose files.
  # Dependabot cannot resolve `FROM ${ARG}`, which is why Dockerfile.api spells its tag out
  # twice instead of holding it in one build argument.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
