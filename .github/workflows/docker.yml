name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: supportlik

jobs:
  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: victus-api
            dockerfile: deploy/Dockerfile.api
          - image: victus-web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=MIT

      - name: Build (and push on main / tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan the built image
        env:
          REF: ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:sha-{3}', env.REGISTRY, env.OWNER, matrix.image, github.sha) || format('{0}/{1}/{2}@{3}', env.REGISTRY, env.OWNER, matrix.image, steps.build.outputs.digest) }}
        run: |
          # On PRs the image is only loaded locally; the sha tag from metadata-action
          # uses the short sha, so resolve the first tag instead.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          fi
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output "trivy-${{ matrix.image }}.sarif" --exit-code 0 --no-progress "$REF"

      - name: Upload the image scan to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}
