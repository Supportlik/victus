name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Angular lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (headless, single run)
        run: npm test -- --watch=false
        env:
          CI: "true"

      # Runs the suite once more under V8 coverage; the thresholds in angular.json fail it.
      - name: Unit test coverage (thresholds in angular.json)
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Coverage report in the job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "coverage/web/coverage-summary.json";
            if (!fs.existsSync(file)) { console.log("No coverage data."); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            const row = (k) => `| ${k} | ${t[k].covered} / ${t[k].total} | ${t[k].pct} % |`;
            console.log(["### Web coverage", "", "| Metric | Covered | % |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
