[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victus"
dynamic = ["version"]
description = "Self-hosted nutrition tracking: REST API, passkey web app, report builder, agent inbox and MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bortlik", email = "michael@bortlik.io" }]
keywords = ["nutrition", "calorie-tracking", "tdee", "fastapi", "passkey", "webauthn", "mcp", "self-hosted"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core runtime. Everything a plain `victus serve` needs; optional integrations
# live in extras so a minimal install stays small and auditable.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "typer>=0.12",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
auth = ["webauthn>=2.1", "argon2-cffi>=23.1"]
transcription = ["openai>=1.40"]
agent = ["anthropic>=0.40", "mcp>=1.2"]
all = ["victus[postgres,auth,transcription,agent]"]

[project.scripts]
victus = "victus.cli.main:main"

[project.urls]
Homepage = "https://github.com/Supportlik/victus"
Repository = "https://github.com/Supportlik/victus"
Issues = "https://github.com/Supportlik/victus/issues"
Changelog = "https://github.com/Supportlik/victus/blob/main/CHANGELOG.md"
Specification = "https://github.com/Supportlik/victus/blob/main/docs/SPEC.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "check-jsonschema>=0.29",
]

# The version lives in src/victus/__init__.py only, so `victus --version` and
# the package metadata can never drift apart.
[tool.hatch.version]
path = "src/victus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/victus"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "web/node_modules", "web/dist", "deploy", "docs/images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "domain: pure domain logic, no I/O",
  "service: use cases against an in-memory database",
  "api: HTTP layer via TestClient",
  "migration: vault import round-trips",
  "slow: long-running tests (skipped by default in pre-commit)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text with typographic quotes is fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["victus"]
mypy_path = "src"
strict = true
warn_unreachable = true
# Framework-heavy layers get strictness later; the domain and application
# layers are strict from day one.
[[tool.mypy.overrides]]
module = ["victus.api.*", "victus.cli.*", "victus.infrastructure.*"]
disallow_untyped_decorators = false
