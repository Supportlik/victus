# Built-in report "checkup" — the "am I on track?" status page.
# Reference: docs/REPORTS.md · Schema: schemas/report-definition.schema.json
# Built-in names are reserved; copy this file under a new name for your own report.

name: checkup
title: "Am I on track?"
description: Weight trend, TDEE, band adherence and forecast for the chosen period.
period:
  default: 14d
  options: [7d, 14d, 30d, 90d, custom]

blocks:
  - type: kpi_tile
    id: current_weight
    title: Weight (moving average)
    source: weight.ma7
  - type: kpi_tile
    id: required_rate
    title: Required rate
    source: goal.rate_kg_per_week
  - type: kpi_tile
    id: required_deficit
    title: Required deficit
    source: goal.deficit_kcal
  - type: kpi_tile
    id: eat_target
    title: Eat to hit the goal
    source: goal.eat_kcal
  - type: timeline
    id: timeline
    title: Weight, intake and TDEE side by side
    tdee_window: 14
  - type: tdee_windows
    windows: [7, 14, 30, 60, 90]
    show_quality: true
  - type: band_distribution
    macros: [kcal, protein, fiber, salt]
  - type: trend
    windows: [7, 14, 21, 30, 60, 90]
  - type: forecast
    horizons: [1m, 3m, 6m]
    with_eta: true
  - type: burndown
    stages: from_settings
  - type: day_list
    columns: [kcal, protein, fiber, weight, status]
  - type: body_composition
    id: body
  - type: energy_split
    id: energy
  - type: text_finding
    id: finding
    source: agent|manual
