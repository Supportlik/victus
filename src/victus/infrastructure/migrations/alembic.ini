# Alembic configuration for Victus. The database URL is injected by
# victus.infrastructure.migrations.runner (from VICTUS_DATABASE__URL / victus.yaml);
# the value below is only a fallback for hand-run `alembic` commands.
[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///data/victus.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
